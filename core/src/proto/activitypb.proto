syntax = "proto3";

package gamepb.activitypb;

import "corepb.proto";
import "autumn-activities.proto";
import "milk-tea.proto";
import "pet-diary.proto";

message ActivityContent {
    int64 activity_id = 1;
    int64 group_id = 2;
    int64 type = 3;
    string name = 4;
    bytes extra = 5;
    int64 begin_time = 6;
    int64 end_time = 7;
    int64 sort_order = 8;
    int64 field_20 = 20;
    int64 field_21 = 21;
    int64 field_22 = 22;
    int64 field_23 = 23;
    int64 settle_start_time = 24;
}

message ActivityItem {
    int64 item_id = 1;
    int64 count = 2;
}

message StarSandGoods {
    int64 goods_id = 1;
    ActivityItem item = 2;
    ActivityItem cost = 3;
    int64 status = 4;
    bool owned = 5;
    int64 sort_order = 6;
    bytes name = 7;
    bytes resource_json = 8;
    int64 field_10 = 10;
    int64 field_11 = 11;
    bytes category = 12;
}

message StarSandGoodsList {
    repeated StarSandGoods goods = 1;
}

message ConstellationNode {
    int64 node_id = 1;
    bool field_2 = 2;
    bool field_3 = 3;
    bool field_4 = 4;
    repeated ActivityItem rewards = 5;
}

message ConstellationGroup {
    int64 group_id = 1;
    bool field_2 = 2;
    string name = 3;
    string links = 4;
    string config_json = 5;
}

message ConstellationData {
    int64 field_1 = 1;
    int64 field_2 = 2;
    int64 field_3 = 3;
    repeated ConstellationNode nodes = 4;
    repeated ConstellationGroup groups = 5;
}

// 雨落成诗：天气采集瓶的产出配置。尚未抓到语义的字段保留协议字段名，
// 避免把客户端静态配置误当成账号动态进度。
message WeatherBottleReward {
    int64 reward_id = 1;
    ActivityItem reward = 3;
    int64 status = 4;
    string probability = 6;
}

message WeatherBottleConfig {
    int64 field_3 = 3;
    int64 field_4 = 4;
    int64 collector_item_id = 5;
    int64 collector_item_count = 6;
    repeated WeatherBottleReward rewards = 8;
    int64 field_9 = 9;
}

message WeatherActivityTask {
    int64 task_id = 1;
    int64 trigger_item_id = 2;
    ActivityItem reward = 3;
    string title = 4;
    int64 daily_limit = 5;
    int64 current = 6;
}

message WeatherActivityTasks {
    repeated WeatherActivityTask tasks = 1;
}

message WeatherResearchNode {
    int64 node_id = 1;
    repeated int64 prerequisite_node_ids = 2 [packed = true];
    int64 status = 3;
    bool claimed = 4;
    int64 field_5 = 5;
    ActivityItem cost = 6;
    ActivityItem reward = 7;
    int64 field_8 = 8;
    int64 field_9 = 9;
}

message WeatherResearchTrack {
    int64 current_stage = 1;
    repeated WeatherResearchNode nodes = 2;
}

message WeatherResearchData {
    WeatherResearchTrack track = 1;
}

message ActivityData {
    ActivityBodyMilkTea milk_tea = 121;
    ActivityBodyGrowthFund growth_fund = 122;
    ActivityBodyWishSign wish_sign = 119;
    ActivityBodyShareReward share_reward = 120;
    ActivityContent activity = 1;
    repeated ActivityData children = 2;
    StarSandGoodsList catalog = 102;
    QingMeiDailySeedData qingmei_daily_seed = 103;
    QingMeiBrewData qingmei_brew = 108;
    ConstellationData constellation = 110;
    ActivityBodyPetTreasureHunt pet_treasure_hunt = 115;
    QixiBridgeConfig qixi_bridge = 112;
    QixiGiftProgress qixi_gift = 113;
    QingMeiQuote qingmei_quote = 114;
    WeatherBottleConfig weather_bottle = 105;
    CharityRedFlowerData charity_red_flower = 116;
    WeatherActivityTasks weather_tasks = 117;
    WeatherResearchData weather_research = 118;
    // 1.17.1.10 抓包新增的活动载荷（2026-11-25）。以下四项内部结构尚未逐项解码，
    // 按原始字节保留，避免解码时丢弃新活动数据：
    //   124: 条目含 UTF8 名称（如「神秘奖活动第 5 弹」）
    //   125: 重复条目 + 头像 URL 列表
    //   126: 单值 + 重复条目（含道具区间 1001/80001 等）
    //   127: 空消息
    bytes field_124 = 124;
    bytes field_125 = 125;
    bytes field_126 = 126;
    bytes field_127 = 127;
    // 130：以薯换福（activity_id 2026111708，组 2026111707）。
    YshfState yishuhuanfu = 130;
}

message CharityRedFlowerProgressReward {
    int64 target = 1;
    ActivityItem reward = 2;
    int64 status = 3;
    // 实机领取前缺失、领取后为 1，用于区分“已达成待领取”和“已领取”。
    bool claimed = 4;
}

message CharityRedFlowerGlobalReward {
